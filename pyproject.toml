[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orag"
version = "0.1.0"
description = "A knowledge base for LLM agents. No embeddings. No vector database. Just files and SQLite."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "anomaly" }]
keywords = ["llm", "rag", "knowledge-base", "cli", "sqlite", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
serve = ["mcp>=1.6.0,<2.0.0"]
dev = ["pytest>=7.0", "mcp>=1.6.0,<2.0.0"]

[project.scripts]
orag = "orag.cli:main"

[project.urls]
Homepage = "https://github.com/anomalyco/orag"
Repository = "https://github.com/anomalyco/orag"
Issues = "https://github.com/anomalyco/orag/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/orag"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
