[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ohkb"
version = "0.2.0"
description = "Simple knowledge base for agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "otofu" }]
keywords = ["llm", "knowledge-base", "cli", "sqlite", "agent", "memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
serve = ["mcp>=1.6.0,<2.0.0"]
dev = [
    "pytest>=7.0",
    "mcp>=1.6.0,<2.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
ohkb = "ohkb.cli:main"

[project.urls]
Homepage = "https://github.com/otofu-git/ohkb"
Repository = "https://github.com/otofu-git/ohkb"
Issues = "https://github.com/otofu-git/ohkb/issues"

[tool.hatch.build]
exclude = [
    "/.idea",
    "/.vscode",
    "/.env*",
    "/.ohkb",
    "**/__pycache__",
    "**/*.pyc",
    "**/.DS_Store",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ohkb"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
